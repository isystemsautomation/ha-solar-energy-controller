name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Use tests/js/*.test.mjs (single-level glob). Do NOT use ** here:
      # bash in GHA does not enable globstar by default, and Node 20 does
      # not expand globs in `node --test`. If tests move into subfolders,
      # enable globstar explicitly: shopt -s globstar
      - name: JavaScript tests
        run: |
          set -euo pipefail
          bash tools/bundle-frontend.sh
          files=(tests/js/*.test.mjs)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::No JS test files matched tests/js/*.test.mjs"
            exit 1
          fi
          echo "Running ${#files[@]} JS test file(s): ${files[*]}"
          node --test "${files[@]}"

      - name: Verify manifest version matches latest tag (on tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(python3 -c "import json; print(json.load(open('custom_components/solar_energy_controller/manifest.json'))['version'])")"
          test "${TAG}" = "${VERSION}"

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
