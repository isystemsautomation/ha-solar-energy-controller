name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches latest tag (on tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(python3 -c "import json; print(json.load(open('custom_components/solar_energy_controller/manifest.json'))['version'])")"
          test "${TAG}" = "${VERSION}"

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Chart interpolation regression tests
        run: node scripts/check_interpolation.mjs
